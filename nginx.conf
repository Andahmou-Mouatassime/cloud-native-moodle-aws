server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Sécurité basique Moodle
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt) {
        deny all;
        return 404;
    }

    # Fichiers statiques servis directement par Nginx
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Redirection du code PHP vers le conteneur PHP-FPM
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_PORT 8081;
    }
}